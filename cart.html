<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Your Bag | SnehaMart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav">

    <a class="brand" href="product.html">
        SnehaMart
    </a>

    <div class="nav-links">

        <a href="product.html">
            Continue shopping
        </a>

    </div>

</nav>


<main class="section">

    <h2>
        Your shopping bag
    </h2>


    <table class="table">

        <thead>

            <tr>
                <th>Dress</th>
                <th>Size</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>

        </thead>

        <tbody id="cartItems">

        </tbody>

    </table>


    <p class="price" id="cartTotal">
        Total: ₹0
    </p>


    <a
        class="button"
        href="orders.html"
    >
        Secure checkout
    </a>

</main>


<script>

    /*
     * GET CART
     */

    let cart =
        JSON.parse(
            localStorage.getItem("snehaMartCart")
        ) || [];


    /*
     * IF CART IS EMPTY,
     * ADD A DEFAULT PRODUCT
     */

    if (cart.length === 0) {

        cart.push({

            id: "SM-001",

            name: "Rose Silk Anarkali",

            size: "M",

            quantity: 1,

            price: 2499

        });

        localStorage.setItem(
            "snehaMartCart",
            JSON.stringify(cart)
        );

    }


    /*
     * DISPLAY CART
     */

    const cartItems =
        document.getElementById("cartItems");


    let total = 0;


    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        const subtotal =
            quantity * price;


        total += subtotal;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${item.name}
            </td>

            <td>
                ${item.size}
            </td>

            <td>
                ${quantity}
            </td>

            <td>
                ₹${subtotal}
            </td>

        `;


        cartItems.appendChild(row);

    });


    /*
     * SHOW TOTAL
     */

    document.getElementById(
        "cartTotal"
    ).textContent =
        "Total: ₹" + total;

</script>


</body>

</html>
