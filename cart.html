<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Bag | SnehaMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav">
    <a class="brand" href="product.html">SnehaMart</a>

    <div class="nav-links">
        <a href="product.html">Continue Shopping</a>
        <a href="orders.html">Orders</a>
    </div>
</nav>


<main class="section">

    <h2>Your Shopping Bag</h2>

    <div id="cartContainer"></div>

</main>


<script>

function loadCart() {

    const cart =
        JSON.parse(localStorage.getItem("snehaMartCart")) || [];

    const container =
        document.getElementById("cartContainer");

    if (cart.length === 0) {

        container.innerHTML = `
            <p>Your bag is empty.</p>

            <br>

            <a class="button" href="product.html">
                Continue Shopping
            </a>
        `;

        return;
    }


    let total = 0;

    let html = `
        <table class="table">

            <tr>
                <th>Dress</th>
                <th>Size</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
    `;


    cart.forEach(function(item, index) {

        const subtotal =
            Number(item.price) * Number(item.quantity);

        total += subtotal;


        html += `
            <tr>

                <td>
                    ${item.name}
                </td>

                <td>
                    ${item.size}
                </td>

                <td>
                    <button onclick="changeQuantity(${index}, -1)">
                        -
                    </button>

                    ${item.quantity}

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>
                </td>

                <td>
                    ₹${Number(item.price).toLocaleString("en-IN")}
                </td>

                <td>
                    ₹${subtotal.toLocaleString("en-IN")}
                </td>

                <td>
                    <button onclick="removeItem(${index})">
                        Remove
                    </button>
                </td>

            </tr>
        `;
    });


    html += `
        </table>

        <br>

        <h3>
            Total: ₹${total.toLocaleString("en-IN")}
        </h3>

        <br>

        <button class="button" onclick="checkout()">
            Secure Checkout
        </button>
    `;


    container.innerHTML = html;
}



function changeQuantity(index, change) {

    let cart =
        JSON.parse(localStorage.getItem("snehaMartCart")) || [];


    cart[index].quantity =
        Number(cart[index].quantity) + change;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    localStorage.setItem(
        "snehaMartCart",
        JSON.stringify(cart)
    );


    loadCart();
}



function removeItem(index) {

    let cart =
        JSON.parse(localStorage.getItem("snehaMartCart")) || [];


    cart.splice(index, 1);


    localStorage.setItem(
        "snehaMartCart",
        JSON.stringify(cart)
    );


    loadCart();
}



function checkout() {

    let cart =
        JSON.parse(localStorage.getItem("snehaMartCart")) || [];


    if (cart.length === 0) {

        alert("Your bag is empty.");
        return;

    }


    let total = 0;


    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            Number(item.quantity);

    });


    const order = {

        id: "SM-" + Date.now(),

        items: cart,

        total: total,

        date: new Date().toLocaleString(),

        status: "Placed"

    };


    let orders =
        JSON.parse(localStorage.getItem("snehaMartOrders")) || [];


    orders.push(order);


    localStorage.setItem(
        "snehaMartOrders",
        JSON.stringify(orders)
    );


    // Empty cart after successful checkout
    localStorage.removeItem("snehaMartCart");


    alert("Order placed successfully!");


    window.location.href = "orders.html";

}


loadCart();

</script>

</body>
</html>
